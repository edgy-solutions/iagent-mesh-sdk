[project]
# Distribution name kept as-is DELIBERATELY. dag-tools had to become `edgy-dag-tools` because
# `dag-tools`/`dag_tools` collapses to "dagtools", which is taken on PyPI; that collision does
# not apply here — both `iagent-mesh` (PEP-503 normalisation of this name) and `iagentmesh` are
# unregistered. Renaming would also break a real consumer: invincible-agent pins
# `iagent-mesh @ git+...` in 13 pyproject files plus their uv.lock entries, and a distribution
# rename turns every one of those into a metadata-name mismatch. Free name + zero downstream
# churn, so the name stays.
name = "iagent_mesh"
version = "0.9.2"
description = "Universal contracts and infrastructure wrapper for the iagent Mesh — typed predicate registration, transport auth, and per-caller identity for mesh tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chris Nogradi", email = "cnogradi@gmail.com" }
]
keywords = ["agents", "fastapi", "datahub", "knowledge-graph", "ai-mesh", "predicate-graph", "topaz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    # UPPER BOUND IS LOAD-BEARING. `mcp` 2.x renamed FastMCP -> MCPServer, so an unbounded
    # `mcp>=1.0.0` resolved to 2.x and `mcp_server/server.py` failed at import — the SDK's own
    # test suite could not even COLLECT. A floor with no ceiling on a pre-1.0-culture dependency
    # is a build that breaks on someone else's release schedule.
    "mcp>=1.0.0,<2",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0.0",
    "nest-asyncio>=1.5.0",
    # Bearer verification in transport_auth. Was imported defensively (`except ImportError ->
    # "pyjwt-missing"`) but never declared, so the REQUIRE posture's verification silently
    # degraded to unverified on any install that lacked it — a security control whose absence
    # was reported as a caller-side reason string.
    "pyjwt>=2.0.0",
    # DataHub emitter for predicate-graph registration (ADR-0004/0006).
    # Lazy-imported in core.py — only loaded when MESH_REGISTER_ON_STARTUP=true.
    "acryl-datahub>=0.13.0",
]
# 3.10, not 3.9: `mcp` requires >=3.10, so the declared floor was one the dependency set could
# never satisfy — uv reported the project's own requirements as unsatisfiable rather than
# resolving. The code also uses PEP-604/585 forms (`list[str]`, `str | None`) throughout.
requires-python = ">=3.10"

[project.optional-dependencies]
# ── THE SERVER STACK, OPTIONAL SINCE 0.9.3 ──────────────────────────────────────────────────
# Needed only to SERVE: `iagent_mesh.core` (the engine host) and the FastAPI dependency factory
# in `transport_auth`. The CLIENT surface — CallerIdentity, current_caller, the mesh interfaces,
# MeshResult, the conformance helpers — imports and runs without any of it.
#
# THIS IS THE SECOND HALF OF A TWO-COMMIT CHANGE AND THE ORDER WAS LOAD-BEARING. The guard that
# makes `transport_auth` importable without fastapi shipped in 0.9.1 and has had its own green CI
# run. Shipping this extra in the same commit would have meant it rode on the CLAIM that the
# guard was present, when the guard's run is the evidence its safety depends on. Without the
# guard, this line converts a loud install failure into a SILENT AUTHORIZATION CHANGE in any
# consumer that soft-imports the SDK — dag-tools returns (sdk_present=False, None) under a bare
# `except`, which makes its request-context rung non-terminal and drops a per-user read to the
# service identity.
#
# MEASURED, so nobody has to guess what this achieves:
#   * `fastapi` is genuinely removed for non-web consumers — `mcp` (a hard dependency) pulls
#     starlette, NOT fastapi, so nothing else drags it in.
#   * `uvicorn` moving out changes nothing today: the SDK never imports it (checked by AST, zero
#     references), and `mcp` requires it, so every install still gets it. It is here because
#     declaring a dependency this package does not use was always wrong, not because the move
#     removes anything.
#   * SIX FLEET ENGINES DECLARE NO uvicorn OF THEIR OWN — data_analyst, finance_agent,
#     neo4j_expert, planning_agent, restate_analyst, weaviate_expert. They keep working ONLY
#     because `mcp` supplies it. That safety is ACCIDENTAL, not declared, and it should be fixed
#     on the fleet side: an app that runs uvicorn should say so.
server = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
# DEV DEPENDS ON THE SERVER EXTRA, because THE SUITE TESTS THE SERVER SURFACE. Eight modules
# import `fastapi.testclient` or `iagent_mesh.core` directly, so a dev environment without the
# stack cannot COLLECT, let alone run.
#
# This was found by CI and could not have been found locally: moving fastapi to an extra left it
# already installed in every existing venv, so the declared set and the actual environment
# disagreed and only a clean resolution could tell. Fixing the WORLD (the declaration) rather
# than the arms — the eight modules genuinely need a web framework.
#
# A SELF-REFERENCE, not a second copy of the version bounds: `server` owns them, `dev` asks for
# it by name. Two lists would be free to drift, and a dev environment resolving a different
# fastapi than the extra declares is the divergence this whole change is about.
dev = ["pytest", "pytest-asyncio", "httpx", "pytest-mock", "iagent-mesh[server]"]

[project.urls]
Homepage = "https://github.com/edgy-solutions/iagent-mesh-sdk"
Repository = "https://github.com/edgy-solutions/iagent-mesh-sdk"
Issues = "https://github.com/edgy-solutions/iagent-mesh-sdk/issues"

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iagent_mesh"]

# TEMPLATES SHIP INSIDE THE PACKAGE. `scaffold_core` resolves them relative to its own file, so
# in a REPO CHECKOUT `../templates` exists and scaffolding works — but the wheel carried only
# `iagent_mesh/`, so from an installed distribution the same call raised
# `FileNotFoundError: .../site-packages/templates`. Every test passes from the repo, which is
# exactly why this survived: the suite never ran against an installed wheel.
#
# Mapped INTO the package (`iagent_mesh/templates`) rather than shipped as a top-level
# `templates/` directory — a top-level name that generic would collide with any other
# distribution doing the same thing in site-packages.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "iagent_mesh/templates"

# The sdist keeps the repo layout (tests + templates at top level) so `uv build` from an sdist
# reproduces the wheel and the suite is runnable from it.
[tool.hatch.build.targets.sdist]
include = ["iagent_mesh", "templates", "tests", "mcp_server", "app.py", "README.md", "LICENSE",
           "pytest.ini", "docs"]
